<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloatTodo</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F4;
  --group:#FFFFFF;
  --ink:rgba(0,0,0,.88);
  --soft:rgba(0,0,0,.56);
  --line:rgba(0,0,0,.09);
  --field:rgba(0,0,0,.06);
  --raised:#FFFFFF;
  --wash:rgba(0,0,0,.05);
  --danger:#C4322B;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1E1E20;
    --group:#2B2B2E;
    --ink:rgba(255,255,255,.92);
    --soft:rgba(255,255,255,.6);
    --line:rgba(255,255,255,.1);
    --field:rgba(255,255,255,.09);
    --raised:rgba(255,255,255,.2);
    --wash:rgba(255,255,255,.08);
    --danger:#FF7B72;
  }
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);overflow:hidden}
body{
  padding:16px;
  font:13px/18px -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans CJK SC",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  cursor:default;
}
button{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;background:none;font:inherit;line-height:1;color:inherit;cursor:default}
button:focus{outline:none}
button:focus-visible{outline:2px solid #0A84FF;outline-offset:1px}
svg{display:block;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

.group{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--line)}
.group + .group{margin-top:14px}
h2{margin:16px 4px 6px;font-size:12px;font-weight:500;color:var(--soft)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:8px 12px}
.row + .row{border-top:.5px solid var(--line)}
.label{flex:1;min-width:0}
.sub{margin-top:1px;font-size:11px;line-height:15px;color:var(--soft)}
.sub.error{color:var(--danger)}

.seg{display:inline-flex;flex:none;gap:1px;padding:2px;background:var(--field);border-radius:8px}
.seg button{height:24px;padding:0 11px;font-size:12px;color:var(--soft);border-radius:6px;white-space:nowrap}
.seg button[aria-pressed=true]{color:var(--ink);background:var(--raised);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.08)}

.key{flex:none;height:26px;min-width:88px;padding:0 10px;font-size:12px;background:var(--field);border-radius:7px;white-space:nowrap}
.key.recording{box-shadow:0 0 0 2px #0A84FF;background:none}

.switch{position:relative;flex:none;width:36px;height:22px;border-radius:11px;background:var(--field);box-shadow:inset 0 0 0 .5px var(--line);transition:background .16s ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .16s ease}
.switch[aria-checked=true]{background:#34A853;background:-apple-system-control-accent}
.switch[aria-checked=true]::after{transform:translateX(14px)}

.slider{display:flex;flex:none;align-items:center;gap:8px;width:190px}
.slider input{flex:1;min-width:0;margin:0}
.slider output{width:34px;text-align:right;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}

.repeats{max-height:176px;overflow-y:auto}
.repeats::-webkit-scrollbar{width:0;height:0;display:none}
.repeat .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repeat .name{overflow:hidden;text-overflow:ellipsis}
.remove{flex:none;width:24px;height:24px;margin-right:-4px;color:var(--soft);border-radius:6px}
.remove svg{width:14px;height:14px;stroke-width:1.3}
.remove:hover{color:var(--ink);background:var(--wash)}
.empty{padding:12px;color:var(--soft);font-size:12px}
.hint{margin:8px 4px 0;font-size:11px;line-height:15px;color:var(--soft)}
#heightRow[hidden]{display:none}
</style>
</head>
<body>
<main id="app">
  <section class="group">
    <div class="row"><span id="tLang" class="label"></span>
      <span class="seg" data-key="language" role="group">
        <button type="button" data-v="zh">中文</button><button type="button" data-v="en">English</button>
      </span>
    </div>
    <div class="row"><span id="tLook" class="label"></span>
      <span class="seg" data-key="appearance" role="group">
        <button type="button" data-v="system" id="lookSystem"></button><button type="button" data-v="light" id="lookLight"></button><button type="button" data-v="dark" id="lookDark"></button>
      </span>
    </div>
    <div class="row"><label id="tAlpha" class="label" for="alpha"></label>
      <span class="slider"><input id="alpha" type="range" min="0" max="100" step="5"><output id="alphaOut" for="alpha"></output></span>
    </div>
    <div class="row" id="heightRow"><span id="tHeight" class="label"></span>
      <button type="button" class="key" id="autoHeight"></button>
    </div>
  </section>
  <p id="tResizeHint" class="hint"></p>

  <h2 id="tKeys"></h2>
  <section class="group">
    <div class="row"><div class="label"><div id="tToggle"></div><div id="errToggle" class="sub"></div></div>
      <button type="button" class="key" data-which="toggle" id="keyToggle"></button>
    </div>
  </section>

  <h2 id="tGeneral"></h2>
  <section class="group">
    <div class="row"><span id="tLogin" class="label"></span>
      <button type="button" id="login" class="switch" role="switch" aria-labelledby="tLogin"></button>
    </div>
  </section>

  <h2 id="tRepeats"></h2>
  <section class="group repeats" id="repeats"></section>
</main>

<template id="repeatTpl">
  <div class="row repeat">
    <div class="label"><div class="name"></div><div class="sub"></div></div>
    <button type="button" class="remove"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
  </div>
</template>

<script>
(function () {
  'use strict';

  const TEXT = {
    zh: {
      htmlLang: 'zh-CN', lang: '语言', look: '外观', system: '跟随系统', light: '浅色', dark: '深色', alpha: '透明度',
      resizeHint: '想调大小：拖动小窗的左右边缘、下边缘或下角。拉过下边缘后高度会固定，双击下边缘恢复自动。',
      height: '窗口高度已固定', autoHeight: '恢复自动高度',
      keys: '全局快捷键', toggle: '显示或隐藏小窗', keyHint: '点右边的按钮，按下新的组合键就能自定义', press: '按下快捷键…',
      needMod: '要包含 ⌃、⌥ 或 ⌘ 中的至少一个', taken: '被其他 app 占用了，请换一个', unsupported: '不支持这个按键',
      general: '通用', login: '开机自动启动',
      repeats: '重复任务', noRepeats: '还没有重复任务。在小窗里把鼠标移到任务上，点 ↻ 就能设置。', stop: '停止重复：',
    },
    en: {
      htmlLang: 'en', lang: 'Language', look: 'Appearance', system: 'System', light: 'Light', dark: 'Dark', alpha: 'Transparency',
      resizeHint: 'To resize, drag the left, right, or bottom edge, or a bottom corner. Dragging the bottom edge fixes the height. Double-click it to go back to automatic.',
      height: 'Window height is fixed', autoHeight: 'Use automatic height',
      keys: 'Global shortcuts', toggle: 'Show or hide the window', keyHint: 'Click the button and press new keys to customize', press: 'Press keys…',
      needMod: 'Include at least one of ⌃, ⌥, or ⌘', taken: 'Another app is using this. Try a different one', unsupported: 'This key is not supported',
      general: 'General', login: 'Open at login',
      repeats: 'Repeating tasks', noRepeats: 'No repeating tasks yet. Hover over a task in the window and click ↻ to set one.', stop: 'Stop repeating: ',
    },
  };

  const $ = (id) => document.getElementById(id);
  const handlers = window.webkit && window.webkit.messageHandlers;
  const bridge = handlers && handlers.settings;
  const post = (message) => { if (bridge) { try { bridge.postMessage(message); } catch (_) {} } };

  let s = {
    language: 'zh', appearance: 'system', transparency: 50, login: true, heightLocked: false,
    hotKeys: { toggle: '⌃⌥T' }, repeats: [],
  };
  let recording = null;
  let errors = { toggle: '' };
  let lastHeight = 0;

  const L = () => TEXT[s.language] || TEXT.zh;

  function setText(id, value) { $(id).textContent = value; }

  function render() {
    const t = L();
    document.documentElement.lang = t.htmlLang;
    setText('tLang', t.lang);
    setText('tLook', t.look);
    setText('lookSystem', t.system);
    setText('lookLight', t.light);
    setText('lookDark', t.dark);
    setText('tAlpha', t.alpha);
    setText('tResizeHint', t.resizeHint);
    setText('tHeight', t.height);
    setText('autoHeight', t.autoHeight);
    $('heightRow').hidden = !s.heightLocked;
    setText('tKeys', t.keys);
    setText('tToggle', t.toggle);
    setText('tGeneral', t.general);
    setText('tLogin', t.login);
    setText('tRepeats', t.repeats);

    document.querySelectorAll('.seg').forEach((seg) => {
      seg.setAttribute('aria-labelledby', seg.dataset.key === 'language' ? 'tLang' : 'tLook');
      seg.querySelectorAll('button').forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset.v === s[seg.dataset.key] ? 'true' : 'false');
      });
    });

    if (document.activeElement !== $('alpha')) $('alpha').value = s.transparency;
    setText('alphaOut', Math.round(s.transparency) + '%');
    $('login').setAttribute('aria-checked', s.login ? 'true' : 'false');

    const key = $('keyToggle'), isRecording = recording === 'toggle';
    key.textContent = isRecording ? t.press : s.hotKeys.toggle;
    key.classList.toggle('recording', isRecording);
    const note = $('errToggle');
    note.textContent = errors.toggle ? t[errors.toggle] : t.keyHint;
    note.classList.toggle('error', !!errors.toggle);

    renderRepeats(t);
    report();
  }

  function renderRepeats(t) {
    const box = $('repeats');
    box.textContent = '';
    if (!s.repeats.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = t.noRepeats;
      box.appendChild(empty);
      return;
    }
    s.repeats.forEach((item) => {
      const row = $('repeatTpl').content.firstElementChild.cloneNode(true);
      row.querySelector('.name').textContent = item.text;
      row.querySelector('.sub').textContent = item.note ? item.label + (s.language === 'en' ? ', ' : '，') + item.note : item.label;
      const remove = row.querySelector('.remove');
      remove.setAttribute('aria-label', t.stop + item.text);
      remove.addEventListener('click', () => post({ type: 'stopRepeat', id: item.id }));
      box.appendChild(row);
    });
  }

  function report() {
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (height && height !== lastHeight) {
      lastHeight = height;
      post({ type: 'resize', height });
    }
  }

  function setValue(key, value) {
    s[key] = value;
    post({ type: 'set', key, value });
    render();
  }

  document.querySelectorAll('.seg button').forEach((b) => {
    b.addEventListener('click', () => setValue(b.parentNode.dataset.key, b.dataset.v));
  });
  $('alpha').addEventListener('input', (e) => setValue('transparency', Number(e.target.value)));
  $('login').addEventListener('click', () => setValue('login', !s.login));

  /* ---------- 录制快捷键 ---------- */

  function startRecording(which) {
    if (!recording) post({ type: 'recordStart' });
    recording = which;
    errors[which] = '';
    render();
  }

  function stopRecording() {
    if (!recording) return;
    recording = null;
    post({ type: 'recordEnd' });
    render();
  }

  function keyLabel(code) {
    if (code.indexOf('Key') === 0) return code.slice(3);
    if (code.indexOf('Digit') === 0) return code.slice(5);
    if (/^F\d+$/.test(code)) return code;
    const names = { Space: 'Space', Minus: '-', Equal: '=', Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Backquote: '`' };
    return names[code] || '';
  }

  $('keyToggle').addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording('toggle');
  });
  $('autoHeight').addEventListener('click', () => post({ type: 'autoHeight' }));

  document.addEventListener('click', (e) => {
    if (recording && !e.target.closest('#keyToggle')) stopRecording();
  });

  document.addEventListener('keydown', (e) => {
    if (!recording) {
      if (e.key === 'Escape') post({ type: 'close' });
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    if (e.key === 'Escape') { stopRecording(); return; }
    if (['Control', 'Alt', 'Shift', 'Meta', 'CapsLock', 'Fn', 'AltGraph'].indexOf(e.key) >= 0) return;
    const which = recording;
    if (!(e.ctrlKey || e.altKey || e.metaKey)) {
      errors[which] = 'needMod';
      render();
      return;
    }
    const label = keyLabel(e.code);
    if (!label) {
      errors[which] = 'unsupported';
      render();
      return;
    }
    const title = (e.ctrlKey ? '⌃' : '') + (e.altKey ? '⌥' : '') + (e.shiftKey ? '⇧' : '') + (e.metaKey ? '⌘' : '') + label;
    post({ type: 'setHotKey', which, code: e.code, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, meta: e.metaKey, title });
    recording = null;
    render();
  }, true);

  ['dragstart', 'dragover', 'drop'].forEach((name) => document.addEventListener(name, (e) => e.preventDefault()));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  new ResizeObserver(report).observe(document.documentElement);

  window.S = {
    update(partial) {
      Object.assign(s, partial);
      if (partial.hotKeys) errors = { toggle: '' };
      render();
    },
    hotKeyError(which, reason) {
      errors[which] = reason;
      render();
    },
    windowClosing() { stopRecording(); },
  };

  render();
  post({ type: 'ready' });
})();
</script>
</body>
</html>
